            const chart2 = echarts.init(document.getElementById('chartAbnormalType2'));
            
            const colorPalette = ['#6366F1', '#EC4899', '#14B8A6', '#F59E0B', '#8B5CF6'];
            
            const option = {
                tooltip: { trigger: 'item', backgroundColor: '#FFFFFF', borderColor: '#E2E8F0', borderWidth: 1, textStyle: { color: '#1E293B', fontSize: 12 } },
                legend: { orient: 'vertical', right: '5%', top: 'center', textStyle: { color: '#1E293B', fontSize: 12 } },
                series: [{ type: 'pie', radius: ['35%', '65%'], center: ['40%', '50%'], data: dataAbnormalType.map((d, i) => ({ name: d.name, value: d.value, itemStyle: { color: colorPalette[i] } })), label: { show: true, formatter: '{b}\n{c}条 ({d}%)', color: '#1E293B', fontSize: 11 }, emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } } }]
            };
            
            chart1.setOption(option);
            chart2.setOption(option);
            charts.push(chart1, chart2);
        }
        
        // 图表6: 样本户层级分布
        function initChartLevelDist() {
            const chart = echarts.init(document.getElementById('chartLevelDist'));
            
            const colorPalette = ['#2563EB', '#059669', '#D97706'];
            
            const option = {
                tooltip: { trigger: 'item', backgroundColor: '#FFFFFF', borderColor: '#E2E8F0', borderWidth: 1, textStyle: { color: '#1E293B', fontSize: 12 } },
                legend: { orient: 'vertical', right: '5%', top: 'center', textStyle: { color: '#1E293B', fontSize: 12 } },
                series: [{ type: 'pie', radius: ['35%', '65%'], center: ['40%', '50%'], data: dataLevelDist.map((d, i) => ({ name: d.name, value: d.value, itemStyle: { color: colorPalette[i] } })), label: { show: true, formatter: '{b}\n{c}条 ({d}%)', color: '#1E293B', fontSize: 11 }, emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } } }]
            };
            
            chart.setOption(option);
            charts.push(chart);
        }
        
        // 图表7: 客户分档TOP10
        function initChartTierTop10() {
            const chart = echarts.init(document.getElementById('chartTierTop10'));
            
            const option = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: '#FFFFFF', borderColor: '#E2E8F0', borderWidth: 1, textStyle: { color: '#1E293B', fontSize: 12 } },
                grid: Object.assign({}, commonGrid, { left: '8%', right: '5%' }),
                xAxis: { type: 'value', axisLine: commonAxisLine, axisLabel: { color: '#64748B', fontSize: 11 }, splitLine: { lineStyle: { color: '#E2E8F0', type: 'dashed' } } },
                yAxis: { type: 'category', data: dataTierTop10.map(d => d.name).reverse(), axisLine: { lineStyle: { color: '#E2E8F0' } }, axisLabel: { color: '#1E293B', fontSize: 12 } },
                series: [{ type: 'bar', data: dataTierTop10.map(d => d.value).reverse(), barWidth: '50%', itemStyle: { color: { type: 'linear', x: 0, y: 0, x2: 1, y2: 0, colorStops: [{ offset: 0, color: '#6366F1' }, { offset: 1, color: '#8B5CF6' }] }, borderRadius: [0, 6, 6, 0] }, label: { show: true, position: 'right', color: '#1E293B', fontSize: 12, fontWeight: 600 } }]
            };
            
            chart.setOption(option);
            charts.push(chart);
        }
        
        // 图表8: 价采户占比
        function initChartPriceCollection() {
            const chart = echarts.init(document.getElementById('chartPriceCollection'));
            
            const option = {
                tooltip: { trigger: 'item', backgroundColor: '#FFFFFF', borderColor: '#E2E8F0', borderWidth: 1, textStyle: { color: '#1E293B', fontSize: 12 } },
                legend: { orient: 'vertical', right: '5%', top: 'center', textStyle: { color: '#1E293B', fontSize: 12 } },
                series: [{ type: 'pie', radius: ['35%', '65%'], center: ['40%', '50%'], data: dataPriceCollection.map((d, i) => ({ name: d.name, value: d.value, itemStyle: { color: i === 0 ? '#64748B' : '#F59E0B' } })), label: { show: true, formatter: '{b}\n{c}条 ({d}%)', color: '#1E293B', fontSize: 11 }, emphasis: { itemStyle: { shadowBlur: 10, shadowColor: 'rgba(0,0,0,0.2)' } } }]
            };
            
            chart.setOption(option);
            charts.push(chart);
        }
        
        // 图表9: 异常类型按分公司分布
        function initChartStackByBranch() {
            const chart = echarts.init(document.getElementById('chartStackByBranch'));

            const colorPalette = ['#6366F1', '#EC4899', '#14B8A6', '#F59E0B', '#8B5CF6'];

            const option = {
                tooltip: { trigger: 'axis', axisPointer: { type: 'shadow' }, backgroundColor: '#FFFFFF', borderColor: '#E2E8F0', borderWidth: 1, textStyle: { color: '#1E293B', fontSize: 12 } },
                legend: { data: dataStackByBranch.types, top: 0, textStyle: { color: '#1E293B', fontSize: 11 } },
                grid: Object.assign({}, commonGrid, { top: '12%' }),
                xAxis: { type: 'category', data: dataStackByBranch.branches, axisLine: { lineStyle: { color: '#E2E8F0' } }, axisLabel: { color: '#1E293B', fontSize: 12, fontWeight: 500 } },
                yAxis: { type: 'value', axisLine: commonAxisLine, axisLabel: { color: '#64748B', fontSize: 12 }, splitLine: { lineStyle: { color: '#E2E8F0', type: 'dashed' } } },
                series: dataStackByBranch.types.map((type, i) => ({ name: type, type: 'bar', stack: 'total', data: dataStackByBranch.data.map(row => row[i]), itemStyle: { color: colorPalette[i] }, label: { show: false } }))
            };

            chart.setOption(option);
            charts.push(chart);
        }

        // 图表10: 日均异常率（公平对比）
        function initChartDailyRate() {
            const chart = echarts.init(document.getElementById('chartDailyRate'));

            const option = {
                tooltip: {
                    trigger: 'axis',
                    backgroundColor: '#FFFFFF',
                    borderColor: '#E2E8F0',
                    borderWidth: 1,
                    textStyle: { color: '#1E293B', fontSize: 12 },
                    formatter: function(params) {
                        const d = dataDailyRate.find(item => item.name === params[0].name);
                        return `${params[0].name}<br/>异常数：${d.abnormal}<br/>当前户数：${d.total}<br/>天数：${d.days}天<br/>总户次：${d.total_customer_times}<br/>日均异常率：${d.rate}%`;
                    }
                },
                grid: { left: '3%', right: '12%', bottom: '3%', top: '10%', containLabel: true },
                xAxis: {
                    type: 'value',
                    max: 35,
                    axisLine: commonAxisLine,
                    axisLabel: { color: '#64748B', fontSize: 12, formatter: '{value}%' },
                    splitLine: { lineStyle: { color: '#E2E8F0', type: 'dashed' } }
                },
                yAxis: {
                    type: 'category',
                    data: dataDailyRate.map(d => d.name),
                    axisLine: { lineStyle: { color: '#E2E8F0' } },
                    axisLabel: { color: '#1E293B', fontSize: 12 },
                    axisTick: { show: false }
                },
                series: [{
                    type: 'bar',
                    data: dataDailyRate.map(d => d.rate),
                    barWidth: '50%',
                    itemStyle: {
                        color: function(params) { return BRANCH_COLORS[params.name]; },
                        borderRadius: [0, 4, 4, 0]
                    },
                    label: {
                        show: true,
                        position: 'right',
                        formatter: '{c}%',
                        color: '#1E293B',
                        fontSize: 12,
                        fontWeight: 600
                    }
                }]
            };

            chart.setOption(option);
            charts.push(chart);
        }
        
        // 明细表功能
        function getBranchClass(branch) {
            const map = { '思明': 'branch-siming', '湖里': 'branch-huli', '集美': 'branch-jimei', '第一': 'branch-diyi' };
            return map[branch] || '';
        }
        
        function renderTable() {
            const start = (currentPage - 1) * pageSize;
            const end = start + pageSize;
            const pageData = filteredData.slice(start, end);
            
            const tbody = document.getElementById('tableBody');
            tbody.innerHTML = pageData.map(row => `
                <tr>
                    <td><span class="branch-tag ${getBranchClass(row['分公司'])}">${row['分公司']}</span></td>
                    <td>${row['客户名称']}</td>
                    <td>${row['样本户层级']}</td>
                    <td>${row['客户分档名称']}</td>
                    <td>${row['是否价采户']}</td>
                    <td style="max-width: 200px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;" title="${row['异常信息']}">${row['异常信息']}</td>
                </tr>
            `).join('');
            
            document.getElementById('paginationInfo').textContent = `第 ${currentPage} / ${Math.ceil(filteredData.length / pageSize)} 页，共 ${filteredData.length} 条记录`;
            document.getElementById('prevBtn').disabled = currentPage === 1;
            document.getElementById('nextBtn').disabled = currentPage >= Math.ceil(filteredData.length / pageSize);
        }
        
        function filterTable() {
            const branchFilter = document.getElementById('filterBranch').value;
            const searchText = document.getElementById('searchInput').value.toLowerCase();
            
            filteredData = detailData.filter(row => {
                const matchBranch = !branchFilter || row['分公司'] === branchFilter;
                const matchSearch = !searchText || row['客户名称'].toLowerCase().includes(searchText);
                return matchBranch && matchSearch;
            });
            
            currentPage = 1;
            renderTable();
        }
        
        function prevPage() {
            if (currentPage > 1) {
                currentPage--;
                renderTable();
            }
        }
        
        function nextPage() {
            if (currentPage < Math.ceil(filteredData.length / pageSize)) {
                currentPage++;
                renderTable();
            }
        }
        
        // 页面加载完成后初始化所有图表
        window.addEventListener('DOMContentLoaded', function() {
            initSummaryCards();
            initChartBranchStats();
            initChartCompletionRate();
            initChartDailyTrend();
            initChartAccumulate();
            initChartDailyByBranch();
            initChartAbnormalType();
            initChartLevelDist();
            initChartTierTop10();
            initChartPriceCollection();
            initChartStackByBranch();
            initChartDailyRate();
            renderTable();
            
            window.addEventListener('resize', function() {
                charts.forEach(chart => chart.resize());
            });
        });
    </script>
</body>
</html>
